<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1a1f" />
    <!-- Three itinerary lines with one of them short: an itinerary with a
         line still in play. The SVG is authoritative and the PNGs are
         fallbacks for browsers that won't take one; all three are drawn to
         the same 16x16 whole-pixel grid, so favicon-32.png is the geometry
         at 2x rather than an upscale of the 16. (favicon-preview.png in the
         handoff is a review-only zoom and is deliberately not shipped.) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <title>Vacation Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
