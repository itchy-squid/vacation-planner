name: Deploy

# Deploys/updates the Azure infrastructure via Bicep, runs pending Alembic
# migrations, builds the backend image and points the Container App at it,
# and deploys the built frontend to Azure Static Web Apps — against one of
# two environments, "dev" or "prod" (see infra/README.md "Environments").
# Migrations (the "migrate" job) always run before the backend image is
# swapped in, connected as the "gh-deploy" Postgres role -- see
# infra/sql/provision_roles.sql and claude/db-privilege-provisioning.md.
#
# Which environment a run targets:
#   - A pull request against `main` (opened, new commits pushed, or
#     reopened) deploys that PR's branch to "dev". Every open PR deploys
#     to the same dev environment, so dev always shows whichever PR was
#     updated most recently. PRs from forks and from Dependabot are
#     skipped: GitHub doesn't give those runs the OIDC token or the
#     environment secrets a deploy needs.
#   - A push to `main` (i.e. merging a PR) deploys "prod" automatically.
#     Add a required reviewer on the "prod" GitHub Environment if you
#     want a manual approval before it goes out.
#   - Manually running this workflow (Actions tab -> Deploy -> Run
#     workflow) lets you pick "dev" or "prod" from a dropdown, e.g. to
#     put `main` back on dev or to redeploy prod.
# Runs are queued per environment (see `concurrency` below), never run
# side by side and never cancelled halfway, so two deploys can't
# interleave migrations or image swaps on the same environment.
#
# Watch out for Alembic migrations on dev: a PR's migration is applied to
# dev's database when that PR deploys. If a different PR (without that
# migration) deploys to dev afterwards, its `alembic upgrade head` fails
# because the database is at a revision its code doesn't know. Redeploy
# the PR with the migration, or downgrade dev's database by hand.
#
# One-time setup this workflow assumes (see infra/README.md for the manual
# steps and infra/main.bicep for what gets provisioned), per environment:
#   - A GitHub Environment named exactly "dev" and one named "prod"
#     (Settings -> Environments) — each holds its OWN copies of the
#     variables/secrets below, so dev and prod never share a resource
#     group, registry, Postgres server, or Static Web App. Add a required
#     reviewer on the "prod" environment if you want a manual approval
#     gate before anything deploys there.
#   - Resource group already exists for that environment
#     (vacationplanner-dev / vacationplanner).
#   - The backend identity's two storage roles (Storage Blob Data
#     Contributor + Storage Blob Delegator on the pin-photos storage
#     account, infra/modules/storage-account.bicep) are granted by hand,
#     once per environment, before the first deploy that needs photo
#     uploads to actually work -- this workflow's DEPLOY_CLIENT_ID only
#     has Contributor on the resource group, which can't write role
#     assignments. See infra/README.md "One-time manual setup" step 7.
#   - The database uses Microsoft Entra ID auth only (no Postgres
#     passwords) — see infra/README.md "Managed identity database auth".
#     The one-time role provisioning (infra/sql/provision_roles.sql) is a
#     database-level operation this workflow does not run; it's a manual
#     step in infra/README.md, done once per environment before the first
#     deploy -- and it MUST include mapping this environment's
#     DEPLOY_CLIENT_ID service principal to the "gh-deploy" Postgres role
#     (granted db_owner there), or every run of this workflow's "migrate"
#     job fails to connect.
#   - GitHub's own authentication to Azure (`azure/login@v2` below) is
#     federated (OIDC) — no Azure credential is stored in GitHub at all.
#     Each environment needs its own Entra app registration with a
#     federated credential trusting exactly that GitHub Environment's
#     runs, and Contributor scoped to just that environment's resource
#     group — see infra/README.md "Continuous deployment" for the exact
#     `az` commands, INCLUDING the repository/owner ID GitHub's newer
#     "immutable subject claims" require in the federated credential's
#     subject (a plain `repo:<owner>/<repo>:environment:dev` subject
#     still works today, but only once the repo has opted into immutable
#     subjects does GitHub actually mint tokens with the ID-based subject
#     — mismatching the two fails auth silently rather than erroring
#     clearly, so read the README before creating these credentials).
#     That app registration has its own distinct client ID
#     (DEPLOY_CLIENT_ID below) from the one Easy Auth uses
#     (EASY_AUTH_CLIENT_ID) — two different Entra apps for two different
#     purposes. The tenant, though, is just AZURE_TENANT_ID — the same
#     Entra tenant backs GitHub's login, Postgres's AAD auth, and Easy
#     Auth alike, so there's only ever one tenant ID to set, not one per
#     consumer.
#   - Per-environment VARIABLES (set on the "dev" / "prod" GitHub
#     Environments' "Variables" tab — none of these are secret, they're
#     just per-environment config): DEPLOY_CLIENT_ID / AZURE_SUBSCRIPTION_ID
#     (the federated app registration above), AZURE_TENANT_ID (shared by
#     GitHub's login, Postgres's AAD admin, and Easy Auth),
#     AZURE_RESOURCE_GROUP, ACR_NAME, CONTAINER_APP_NAME, and
#     EASY_AUTH_CLIENT_ID (leave unset until Easy Auth is set up), and
#     EASY_AUTH_GOOGLE_CLIENT_ID (leave unset to keep Google sign-in off). (The
#     Postgres Entra admin is a manual, one-time step now, not something
#     this workflow provisions — see infra/README.md "One-time manual
#     setup", step 6 — so there's no POSTGRES_ADMIN_* variable to set.)
#   - Per-environment SECRETS (same Environments' "Secrets" tab — these
#     ARE sensitive): EASY_AUTH_CLIENT_SECRET (leave unset until Easy Auth
#     is set up), EASY_AUTH_GOOGLE_CLIENT_SECRET (only with EASY_AUTH_GOOGLE_CLIENT_ID),
#     AZURE_STATIC_WEB_APPS_API_TOKEN (from the Static Web App
#     resource, after the first Bicep deploy creates it). Nothing Azure
#     login related is a secret anymore — that's the point of OIDC.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

# One deploy at a time per environment. Queued runs wait rather than
# cancel the one in progress (cancelling mid-migration is worse than
# waiting). The environment here must match resolve-environment below.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'prod' || inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  resolve-environment:
    # Skip PRs that can't deploy: forks and Dependabot get no OIDC token
    # and no environment secrets.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      params-file: ${{ steps.resolve.outputs.params-file }}
    steps:
      - id: resolve
        run: |
          case "${{ github.event_name }}" in
            push)              ENVIRONMENT="prod" ;;   # merged to main
            pull_request)      ENVIRONMENT="dev" ;;    # PR against main
            workflow_dispatch) ENVIRONMENT="${{ inputs.environment }}" ;;
            *) echo "Unexpected event ${{ github.event_name }}"; exit 1 ;;
          esac
          if [ "$ENVIRONMENT" = "prod" ]; then
            PARAMS_FILE="infra/main.parameters.prod.bicepparam"
          else
            PARAMS_FILE="infra/main.parameters.dev.bicepparam"
          fi
          echo "Deploying ${{ github.event_name }} of ${{ github.ref }} to $ENVIRONMENT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "params-file=$PARAMS_FILE" >> "$GITHUB_OUTPUT"

  infra:
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      backend-fqdn: ${{ steps.deploy.outputs.backendUrl }}
      postgres-fqdn: ${{ steps.deploy.outputs.postgresFqdn }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # azure/arm-deploy only accepts ARM-JSON parameter files, not
      # .bicepparam, so infra/main.parameters.*.bicepparam needs
      # azure/bicep-deploy instead -- it takes parameters-file and an
      # inline `parameters` override side by side. That combination is
      # documented as supported but untested here yet, so watch this
      # step's first real run closely (does entraClientId/Secret/TenantId
      # actually reach the deployment alongside the file's own params).
      - name: Deploy infrastructure (Bicep)
        id: deploy
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          name: vacationplanner-${{ needs.resolve-environment.outputs.environment }}
          template-file: infra/main.bicep
          parameters-file: ${{ needs.resolve-environment.outputs.params-file }}
          parameters: |
            {
              "entraClientId": "${{ vars.EASY_AUTH_CLIENT_ID }}",
              "entraClientSecret": "${{ secrets.EASY_AUTH_CLIENT_SECRET }}",
              "entraTenantId": "${{ vars.AZURE_TENANT_ID }}",
              "googleClientId": "${{ vars.EASY_AUTH_GOOGLE_CLIENT_ID }}",
              "googleClientSecret": "${{ secrets.EASY_AUTH_GOOGLE_CLIENT_SECRET }}"
            }

  migrate:
    # Runs `alembic upgrade head` against the environment's Postgres
    # database, connected as the "gh-deploy" Postgres role -- mapped once
    # per environment to THIS job's own DEPLOY_CLIENT_ID service principal
    # via infra/sql/provision_roles.sql, and granted db_owner there (never
    # granted to the app itself). This replaces both "the app migrates
    # itself at container startup" (would need the app to hold db_owner
    # at all times just for this) and "a maintainer runs it by hand" (see
    # claude/db-privilege-provisioning.md for the full history). `backend`
    # below depends on this job so a new image is never pointed at by the
    # Container App before its schema exists.
    needs: [resolve-environment, infra]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run migrations
        env:
          # No stored password: DefaultAzureCredential (backend/app/db.py)
          # falls back to AzureCliCredential when no managed identity is
          # configured, which picks up the `az login` azure/login@v2 just
          # performed as DEPLOY_CLIENT_ID -- same passwordless pattern as
          # a maintainer's own `az login`, just running here instead of on
          # someone's laptop.
          DATABASE_URL: postgresql+psycopg://gh-deploy@${{ needs.infra.outputs.postgres-fqdn }}:5432/vacation_planner?sslmode=require
          USE_AZURE_AD_AUTH: "true"
        run: uv run alembic upgrade head

  backend:
    needs: [resolve-environment, infra, migrate]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push backend image
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "vacation-planner-backend:${{ github.sha }}" \
            --image "vacation-planner-backend:latest" \
            backend

      - name: Point the Container App at the new image
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/vacation-planner-backend:${{ github.sha }}"

  frontend:
    needs: [resolve-environment, infra]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          # Baked into the built JS at build time (Vite env vars are not
          # read at runtime) -- see frontend/src/lib/api.js. Sourced from
          # the infra job's backendUrl output so it always matches
          # whatever main.bicep actually deployed: the backend's custom
          # domain once backendCustomDomainName is set, otherwise its
          # auto-generated *.azurecontainerapps.io hostname.
          VITE_API_BASE_URL: ${{ needs.infra.outputs.backend-fqdn }}
          # Which Easy Auth providers the sign-in screen offers -- derived
          # from the same variables the infra job turns them on with, so
          # the frontend never links to a provider that isn't configured.
          EASY_AUTH_CLIENT_ID: ${{ vars.EASY_AUTH_CLIENT_ID }}
          EASY_AUTH_GOOGLE_CLIENT_ID: ${{ vars.EASY_AUTH_GOOGLE_CLIENT_ID }}
        run: |
          providers=""
          if [ -n "$EASY_AUTH_CLIENT_ID" ]; then providers="aad"; fi
          if [ -n "$EASY_AUTH_GOOGLE_CLIENT_ID" ]; then providers="${providers:+$providers,}google"; fi
          export VITE_AUTH_PROVIDERS="$providers"
          echo "VITE_AUTH_PROVIDERS=$VITE_AUTH_PROVIDERS"
          npm ci
          npm run build

      # Uses the SWA CLI rather than Azure/static-web-apps-deploy: on a
      # pull_request run that action uploads to a per-PR *preview*
      # environment instead of the site itself, so PR deploys would never
      # reach dev's real URL. `--env production` always targets the
      # Static Web App's main site (dev's or prod's, depending on which
      # environment's token this job has).
      - name: Deploy to Azure Static Web Apps
        working-directory: frontend
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: npx --yes @azure/static-web-apps-cli@2 deploy ./dist --env production
