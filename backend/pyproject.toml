[project]
name = "vacation-planner-backend"
version = "0.1.0"
description = "FastAPI/uvicorn backend for the collaborative vacation planner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<3.3",
  "alembic>=1.13,<1.14",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "azure-identity>=1.19,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<0.28",
  "ruff>=0.7,<0.8",
]

# This is an application, not a library — nothing here gets built into a
# wheel or installed as an importable package, so no [build-system]/src
# layout is needed. `uv sync` just creates .venv and installs the
# dependencies above into it.
[tool.uv]
package = false
