# Local development only. Production runs on Azure Container Apps + Azure
# Database for PostgreSQL Flexible Server (see infra/).
services:
  db:
    image: postgres:16-alpine
    container_name: vacation-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: vacation_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d vacation_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
